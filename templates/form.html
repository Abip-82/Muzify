<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate playlist</title>
    <style>
        body {
            background-color: #181818 ;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            width:90%;
            max-width:500px;
            margin:80px auto;
            text-align: center;
        }
        h1 {
            color: #b76cff;
            font-size:45px;
            margin-bottom: 10px;
        }
        h2 {
            color:#b75cff;
            font-size:45px;
            margin-bottom:10px;
        }
        h3 {
            font-size: 45px;
            color:#b74cff;
            margin-bottom:10px
        }
        input {
            width: 100%;
            padding:12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            
        }
    </style>
</head>
<body>
    <center><h1>Muzify</h1></center><br><br>
    <h2>Please fill out the given information</h2>
    <h3>A playlist will be generated based on your preferences.</h3>
    <br><br>
<form action="/playlists" method="POST">
    <p>What is your mood today?</p>
    <input type="text" name="mood" placeholder="Happy? Sad? Energetic? ...." required>
    <p>What is the weather like?</p>
    <input type="text" name="weather" placeholder="Sunny? Rainy? Cloudy? ...." required>
    <p>Any activities?</p>
    <input type="text" name="activities" placeholder="work-out? Studying? Partying? ...." required><br><br>
    <button type="submit">Generate</button>
</form>
</body>
</html>
