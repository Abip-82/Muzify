<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate playlist</title>
    <style>
        body {
            background-color: #181818 ;
            color: white;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #e8ff67;
            font-size:45px;
            margin-bottom: 10px;
        }
        h4 {
            color:#e8ff67;
            font-size:20px;
            margin-bottom:10px;
        }
        p {
            font-size: 15px;
            color:#e8ff67;
            margin-bottom:10px
        }
        input {
            width: 100%;
            padding:12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            background-color: #2a2a2a;
            color:white;
            border:1px solid #444444;
            border-radius:7px;
            font-size:15px;
        }
        input:focus{
            outline:none;
            border-color: 1px solid #e8ff67;
        }
        button {
            margin-top: 10px;
            background-color:#8be848;
            color:white;
            border:none;
            border-radius:8px;
            padding: 12px 30px;
            font-size:16px;
            cursor:pointer;
        }
        button:hover {
            background-color:#e8ff67;
        }
    </style>
</head>
<body>
    <center><h1>Muzify</h1></center><br><br>
    <h4>Please fill out the given information</h4>
    <p>A playlist will be generated based on your preferences.</p>
    <br><br>
<form action="/playlists" method="POST">
    <p>What is your mood today?</p>
    <input type="text" name="mood" placeholder="Happy? Sad? Energetic? ...." required>
    <p>What is the weather like?</p>
    <input type="text" name="weather" placeholder="Sunny? Rainy? Cloudy? ...." required>
    <p>Any activities?</p>
    <input type="text" name="activities" placeholder="work-out? Studying? Partying? ...." required><br><br>
    <button type="submit">Generate</button>
</form>
<p style="margin-top : 20px;"><a href ="/" style ="color:#b76cff ; text-decoration: none;">Back to home</a></p>
</body>
</html>
