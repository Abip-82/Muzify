<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <style>
        body {
            backgroud-color: #181818;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            margin : 0;
        }
        .header {
            text-align : center;
            padding : 40px 20px 20px;
        }
        .header h1 {
            color: #b76cff;
            font-size: 45px;
            margin-bottom: 10px;
        }
        .header h2{
            color : #dddddd;
            font-weight: normal;
        }
        .playlist-container{
            width: 90%;
            max-width:1000px;
            margin: 30px auto;
            display:grid;
            grid-template-columns: repeat(auto-fit, minimax(250px, 1fr));
            gap: 25px;
        }
        .playlist{
            background-color: #242424;
            border-radius: 12px;
            overflow: hidden;
            border:1px solid #333333;
        }
    </style>
</head>
<body>
    <center><h1>Muzify</h1></center>
    <h2>Your playlists are:</h2>
    {% for result in results %}
    <div  class="playlist">
        <img src="{{result['thumbnail']}}" alt="{{result['title']}}">
        <h5>Title:{{result['title']}}</h5>
        <h5>Channel name: {{result['channel']}}</h5>
        <a href ="{{result['url']}}">Open playlist</a>
        <br>
    </div>
    {% endfor %}
</body>
</html>
