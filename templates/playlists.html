<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <style>
        body {
            background-color: #181818;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            margin : 0;
        }
        .header {
            text-align : center;
            padding : 40px 20px 20px;
        }
        .header h1 {
            color: #e8ff67;
            font-size: 45px;
            margin-bottom: 10px;
        }
        .header h2{
            color : #dddddd;
            font-weight: normal;
        }
        .playlist-container{
            width: 90%;
            max-width:1000px;
            margin: 30px auto;
            display:grid;
            grid-template-columns: repeat(auto-fit, minimax(250px, 1fr));
            gap: 25px;
        }
        .playlist{
            background-color: #242424;
            border-radius: 12px;
            overflow: hidden;
            border:1px solid #333333;
        }
        .playlist img{
            width: 100%;
        }
        .palylist-info{
            padding: 18px;
        }
        .playlist-info h3{
            margin :  0 0 10px;
            font-size: 18px;
            color: white;
        }
        .playlist-info p{
            margin: 0 0 18px;
            color:#999999;
            font-size: 14px
        }
        .playlist-info a{
            display: inline-block;
            background-color: #e8ff67;
            color:white;
            text-decoration : none;
            padding: 9px 14px;
            border-radius: 7px;
            font-size: 14px;
        }
        .playlist-info a:hover {
            background-color: #e8ff67;
        }
    </style>
</head>
<body>
    <div class="header">
        <center><h1>Muzify</h1></center>
        <h2>Your playlists are:</h2>
    <div>
    {% for result in results %}
    <div  class="playlist-container">
            <div class = "playlist">
              <img src="{{result['thumbnail']}}" alt="{{result['title']}}">
                <div class="playlist-info">
                    <h5>Title:{{result['title']}}</h5>
                    <h5>Channel name: {{result['channel']}}</h5>
                <div>
                <a href ="{{result['url']}}">Open playlist</a>
                <br>
            <div>
    </div>
    {% endfor %}
</body>
</html>
